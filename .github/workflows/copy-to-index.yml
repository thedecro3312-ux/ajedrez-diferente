name: Copy to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy uploaded file to index.html and remove source
        run: |
          cp ajedrez-diferente.html index.html
          rm ajedrez-diferente.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html ajedrez-diferente.html
          git diff --cached --quiet || git commit -m "Update index.html"
          git push
