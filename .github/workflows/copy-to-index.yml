name: Copy to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-to-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy ajedrez-diferente.html to index.html and remove source
        run: |
          cp ajedrez-diferente.html index.html
          rm ajedrez-diferente.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -A
          git commit -m "Update index.html from ajedrez-diferente.html" || echo "No changes to commit"
          git push
